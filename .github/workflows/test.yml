name: Run Tests

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"

      - name: Install locked dependencies
        run: uv sync --frozen --extra test

      - name: Run tests
        # Environment variables for test configuration (tests use mocks, not real services)
        env:
          MONGODB_URL: mongodb://localhost:27017
          DATABASE_NAME: test_db
          SECRET_KEY: test-secret-key-for-testing
          SESSION_SECRET_KEY: test-session-key-only-never-use-in-production
          ACS_CONNECTION_STRING: endpoint=https://test.placeholder/;accesskey=dGVzdA==
          ACS_SENDER: noreply@test.placeholder
        run: |
          uv run --frozen python -m pytest tests/ -v --tb=short
