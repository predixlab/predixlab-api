[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
dependencies = [
    "aiosmtplib==5.1.3",
    "apscheduler>=3.11.0",
    "authlib==1.9.1",
    "azure-communication-email>=1.0.0",
    "celery==5.3.4",
    "email-validator==2.1.0",
    "fastapi==0.157.0",
    "httpx==0.28.1",
    "itsdangerous==2.1.2",
    "jinja2==3.1.6",
    "mcp>=1.26,<2",
    "numpy==2.3.0",
    "pandas==2.3.0",
    "passlib[bcrypt]==1.7.4",
    "plotly==7.1.0",
    "pyarrow>=18.0.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "pyjwt==2.15.1",
    "pymongo>=4.18.2",
    "python-dotenv==1.2.4",
    "python-multipart==0.0.32",
    "redis==6.4.0",
    "stripe==10.12.0",
    "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=4.1.0",
]

[tool.uv]
constraint-dependencies = [
    "anyio>=4.14.2",
    "azure-core>=1.38.0",
    "certifi>=2026.10.19",
    "cryptography>=50.0.0",
    "idna>=3.15",
    "oauthlib>=4.0.0",
    "pyasn1>=0.6.4",
    "pygments>=2.20.0",
    "requests>=2.33.0",
    "starlette>=1.3.1",
    "urllib3>=2.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
