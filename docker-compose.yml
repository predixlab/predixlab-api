version: '3.8'

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - DATABASE_NAME=predixlab
      - DEBUG=True
    depends_on:
      - mongodb
    volumes:
      - ./results:/app/results
      - ./stock_data:/app/stock_data
    restart: unless-stopped

  mongodb:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    environment:
      - MONGO_INITDB_DATABASE=predixlab
    restart: unless-stopped

volumes:
  mongodb_data:
